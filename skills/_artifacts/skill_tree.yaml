  - name: "count-line-crossings"
    slug: "count-line-crossings"
    type: "core"
    domain: "line-crossing-counting"
    path: "skills/count-line-crossings/SKILL.md"
    description: >
      Tally how many tracked objects cross each virtual line, per direction, with
      LineCrossingCounter. Post-tracking: the caller reduces each tracked detection
      to an anchor point (e.g. foot {(x1+x2)/2, y2}) and passes { trackId, point }
      plus lines defined by two anchor endpoints and an optional forward direction
      { id, p1, p2, forwardDirection }. Detector- and tracker-agnostic, stateful
      (one instance per stream), no drawing; points and lines must share one
      coordinate space (no scaling). forwardDirection (a Vector, or an ordered
      Vector[] whose first entry not parallel to the line wins) fixes which side
      counts as forward independently of endpoint order, defaulting to
      DEFAULT_FORWARD_DIRECTION; forwardNormal exposes the resolved side for
      overlays and reverseDirection flips a line's policy. Optional crossing-assist
      (rescue / cooldown) survives tracker ID churn; defaults DEFAULT_RESCUE_DISTANCE
      / DEFAULT_RESCUE_FRAMES / DEFAULT_COOLDOWN_FRAMES.
    sources:
      - "pj-hoakari/web-crowd-detection-utils:src/line-crossing/counter.ts"
      - "pj-hoakari/web-crowd-detection-utils:src/line-crossing/direction.ts"
      - "pj-hoakari/web-crowd-detection-utils:src/line-crossing/types.ts"
      - "pj-hoakari/web-crowd-detection-utils:src/line-crossing/constants.ts"
